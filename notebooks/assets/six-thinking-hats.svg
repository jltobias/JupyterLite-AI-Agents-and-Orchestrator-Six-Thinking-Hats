<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Six Thinking Hats</title>
<desc id="desc">Six stylized colored hats representing White facts, Red feelings, Black risks, Yellow benefits, Green creativity, and Blue process.</desc>
