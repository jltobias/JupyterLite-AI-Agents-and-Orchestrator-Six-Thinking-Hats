<text x="600" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#202124">Six Thinking Hats</text>
<text x="600" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5f6368">Six deliberate modes of thinking • one problem • a broader view</text>
